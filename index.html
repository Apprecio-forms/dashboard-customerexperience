<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Experiencia del cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"DM Sans"', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#FA345E', light: '#FFF0F3', dark: '#D61F47' },
            neutral: { 50:'#F8F9FA',100:'#F1F3F7',200:'#E4E7EB',300:'#CBD1D6',400:'#9AA0B4',500:'#6B7280',700:'#374151',800:'#1F2937',900:'#111827' }
          }
        }
      }
    };
  </script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{font-family:'DM Sans',sans-serif;background:#F8F9FA;min-height:100vh;color:#1F2937}
    .card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.02),0 1px 3px rgba(0,0,0,.03);border:1px solid #E4E7EB}
    .tab-btn{position:relative;transition:all .2s}
    .tab-btn::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:#FA345E;border-radius:3px 3px 0 0;transform:scaleX(0);transition:transform .2s ease}
    .tab-btn.active{color:#FA345E;font-weight:700}
    .tab-btn.active::after{transform:scaleX(1)}
    .tooltip-box{display:none;position:absolute;z-index:50;width:280px;background:#111827;color:#fff;padding:12px;border-radius:12px;font-size:11px;box-shadow:0 10px 25px rgba(0,0,0,.15);line-height:1.4}
    .tooltip-container:hover .tooltip-box{display:block}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.open{display:flex}
    .modal-box{background:#fff;border-radius:20px;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.25)}
    .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1.5px solid #E4E7EB;background:#F8F9FA}
    .modal-title{font-size:15px;font-weight:700;color:#111827}
    .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#9AA0B4;line-height:1;padding:4px 8px;border-radius:6px;transition:background .15s}
    .modal-close:hover{background:#E4E7EB;color:#111827}
    .modal-body{flex:1;overflow-y:auto;padding:24px}
    .modal-footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1.5px solid #E4E7EB;background:#F8F9FA}
    .report-section{margin-bottom:24px}
    .report-section h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#FA345E;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #FFF0F3}
    .report-group{display:flex;flex-direction:column;gap:10px}
    .report-item{padding:12px 16px;border-radius:8px;border:1px solid #E4E7EB;background:#F8F9FA;font-size:13px;line-height:1.6;color:#374151}
    .report-item.negative{border-left:3px solid #EF4444;background:#FEF2F2}
    .report-item.neutral{border-left:3px solid #F59E0B;background:#FFFBEB}
    .report-item.positive{border-left:3px solid #10B981;background:#F0FDF4}
    .spinner-dark{display:inline-block;width:13px;height:13px;border:2px solid rgba(26,26,46,.2);border-top-color:#FA345E;border-radius:50%;animation:spin .65s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Reporte</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="px-4 py-2 bg-gray-100 text-gray-700 font-bold rounded-xl text-xs uppercase" onclick="closeModal()">Cerrar</button>
        <button class="px-4 py-2 bg-brand text-white font-bold rounded-xl text-xs uppercase" style="background:#FA345E" onclick="printReport()">Descargar PDF</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script>
  const e = React.createElement;
  const { useState, useEffect, useCallback, useMemo, useRef } = React;

  const URL_BACKEND = "https://script.google.com/macros/s/AKfycbx3TEMFdxbYGKZFhF5GSZstiiV6vivCCbLq9L7A2iq5oq6DgrVyM6Q3a5Wd_JLAhbT1Wg/exec";
  const URL_N8N     = "https://n8n.openip.cl/webhook/apprecio-cx-analisis-v2";

  // ─── MODAL HELPERS ───
  function openModal()  { document.getElementById('report-modal').classList.add('open'); }
  function closeModal() { document.getElementById('report-modal').classList.remove('open'); }
  function printReport() {
    const title = document.getElementById('modal-title').textContent;
    const body  = document.getElementById('modal-body').innerHTML;
    const w = window.open('','_blank','width=900,height=700');
    w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>${title}</title>
      <style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;color:#111827;font-size:13px;line-height:1.6;padding:0 20px}
      h1{color:#FA345E;font-size:18px;border-bottom:2px solid #FA345E;padding-bottom:8px;margin-bottom:24px;font-weight:800}
      h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#FA345E;margin:24px 0 10px;padding-bottom:5px;border-bottom:2px solid #FFF0F3}
      .report-item{padding:10px 14px;margin-bottom:8px;border-radius:6px;border:1px solid #E4E7EB;font-size:12px;background:#F8F9FA}
      .report-item.negative{border-left:3px solid #EF4444;background:#FEF2F2}
      .report-item.neutral{border-left:3px solid #F59E0B;background:#FFFBEB}
      .report-item.positive{border-left:3px solid #10B981;background:#F0FDF4}
      </style></head><body><h1>${title}</h1>${body}
      <p style="font-size:11px;color:#9AA0B4;margin-top:32px;border-top:1px solid #E4E7EB;padding-top:12px;text-align:center;">
        Apprecio CX Dashboard · ${new Date().toLocaleString('es-CL')}</p></body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 500);
  }
  document.getElementById('report-modal').addEventListener('click', function(ev){ if(ev.target===this) closeModal(); });

  // ─── LLAMADA IA VÍA N8N ───
  async function llamarIA(prompt, tituloModal) {
    document.getElementById('modal-title').textContent = tituloModal;
    document.getElementById('modal-body').innerHTML = `<div style="text-align:center;padding:40px;color:#6B7280"><span class="spinner-dark"></span> Generando análisis con IA...</div>`;
    openModal();
    try {
      const res = await fetch(URL_N8N, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tipo:'REPORTE_RESPUESTAS_ABIERTAS', datos:{ instrucciones: prompt } })
      });
      if (!res.ok) throw new Error('n8n error');
      const datos = await res.json();
      return datos.respuesta || 'Sin respuesta de IA.';
    } catch(err) { return null; }
  }

  function renderFallbackComentarios(neg, neu, pos) {
    const bloque = (arr, titulo, cls) => !arr.length ? '' : `
      <div class="report-section"><h3>${titulo} (${arr.length})</h3><div class="report-group">
        ${arr.map(r=>`<div class="report-item ${cls}"><strong>${r.empresa}</strong> · <span style="font-weight:700">${r.nota!==undefined?'Nota: '+r.nota:''}</span><br><em style="color:#4A5568">"${r.comentario}"</em></div>`).join('')}
      </div></div>`;
    return bloque(neg,'🔴 Críticos / Negativos','negative') +
           bloque(neu,'🟡 Neutros','neutral') +
           bloque(pos,'🟢 Positivos / Destacados','positive') ||
           `<div style="text-align:center;padding:40px;color:#9AA0B4">Sin respuestas escritas para este corte.</div>`;
  }

  // ─── REPORTE NPS P1 (razon = Col H) ───
  async function reporteNpsP1(filtrados, etiqueta) {
    const items = filtrados.map(r => ({
      empresa: r.cliente||r.pais||'—', nota: parseFloat(r.puntuacion)||0, comentario: (r.razon||'').trim()
    })).filter(r => r.comentario);
    const neg = items.filter(r=>r.nota<=6), neu = items.filter(r=>r.nota>=7&&r.nota<=8), pos = items.filter(r=>r.nota>=9);
    const prompt = buildPromptNPS('NPS P1 · Recomendación de Marca', etiqueta, neg, neu, pos);
    const ia = await llamarIA(prompt, `Reporte NPS P1 · ${etiqueta}`);
    if (ia) {
      document.getElementById('modal-body').innerHTML = renderIABox(ia, items.length);
    } else {
      document.getElementById('modal-body').innerHTML = `<div style="margin-bottom:16px;padding:12px 16px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;font-size:12px;color:#DC2626;font-weight:500">⚠️ Sin conexión IA — análisis local</div>` + renderFallbackComentarios(neg,neu,pos);
    }
  }

  // ─── REPORTE NPS P2 (distribución de notas KAM = Col I) ───
  function reporteNpsP2(filtrados, etiqueta) {
    document.getElementById('modal-title').textContent = `Distribución Notas KAM · ${etiqueta}`;
    const notas = filtrados.map(r=>parseFloat(r.pregunta2)).filter(v=>!isNaN(v));
    const total = notas.length;
    if (!total) {
      document.getElementById('modal-body').innerHTML = `<div style="text-align:center;padding:40px;color:#9AA0B4">Sin notas KAM para este corte.</div>`;
      openModal(); return;
    }
    const prom = (notas.reduce((a,b)=>a+b,0)/total).toFixed(1);
    const altos = notas.filter(v=>v>=9).length, medios = notas.filter(v=>v>=7&&v<9).length, bajos = notas.filter(v=>v<7).length;
    const dist = {};
    notas.forEach(v=>{ dist[v]=(dist[v]||0)+1; });
    document.getElementById('modal-body').innerHTML = `
      <div style="margin-bottom:16px;padding:16px 20px;background:#F0FDF4;border:1px solid #BBF7D0;border-radius:12px;display:flex;gap:24px;align-items:center;">
        <div style="text-align:center"><div style="font-size:28px;font-weight:800;color:#111827">${prom}</div><div style="font-size:11px;color:#6B7280;font-weight:600">Promedio</div></div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
          <div style="text-align:center;padding:8px;background:#F0FDF4;border-radius:8px"><div style="font-size:16px;font-weight:800;color:#16A34A">${altos}</div><div style="font-size:10px;color:#6B7280">Alto (9-10)</div></div>
          <div style="text-align:center;padding:8px;background:#FFFBEB;border-radius:8px"><div style="font-size:16px;font-weight:800;color:#D97706">${medios}</div><div style="font-size:10px;color:#6B7280">Medio (7-8)</div></div>
          <div style="text-align:center;padding:8px;background:#FEF2F2;border-radius:8px"><div style="font-size:16px;font-weight:800;color:#DC2626">${bajos}</div><div style="font-size:10px;color:#6B7280">Bajo (&lt;7)</div></div>
        </div>
      </div>
      <div class="report-section"><h3>Distribución por nota</h3><div class="report-group">
        ${Object.entries(dist).sort((a,b)=>Number(b[0])-Number(a[0])).map(([n,c])=>`
          <div class="report-item ${Number(n)>=9?'positive':Number(n)>=7?'neutral':'negative'}">
            <strong>Nota ${n}</strong> — ${c} respuesta${c>1?'s':''} (${Math.round((c/total)*100)}%)
          </div>`).join('')}
      </div></div>
      <div style="font-size:11px;color:#9AA0B4;margin-top:8px;padding:10px;background:#F8F9FA;border-radius:8px">
        ℹ️ Pregunta 2 evalúa la atención del KAM. Los comentarios cualitativos están en la Pregunta 3.
      </div>`;
    openModal();
  }

  // ─── REPORTE NPS P3 IA (pregunta3 = Col J) ───
  async function reporteNpsP3IA(filtrados, etiqueta) {
    const palabrasNeg = ['mal','falla','error','demora','lento','difícil','problema','falta','nunca','malo','pésimo','complica','no funciona'];
    const palabrasPos = ['bien','excelente','bueno','genial','perfecto','rápido','fácil','increíble','satisfecho','feliz','recomend','siempre'];
    const clsf = txt => { const t=txt.toLowerCase(); const p=palabrasPos.filter(w=>t.includes(w)).length; const n=palabrasNeg.filter(w=>t.includes(w)).length; return n>p?'neg':p>n?'pos':'neu'; };
    const items = filtrados.filter(r=>r.pregunta3&&r.pregunta3.trim()).map(r=>({ empresa:r.cliente||r.pais||'—', comentario:r.pregunta3.trim(), cls:clsf(r.pregunta3) }));
    const neg = items.filter(r=>r.cls==='neg'), neu = items.filter(r=>r.cls==='neu'), pos = items.filter(r=>r.cls==='pos');
    const prompt = `Eres analista CX senior de Apprecio (plataforma B2B de beneficios en LATAM).
PREGUNTA: "¿Qué podríamos mejorar o agregar para entregarte más valor?" | CORTE: ${etiqueta} | TOTAL: ${items.length} respuestas
${neg.length?`\nCRÍTICOS (${neg.length}):\n${neg.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa}: "${r.comentario}"`).join('\n')}`:'' }
${neu.length?`\nSUGERENCIAS (${neu.length}):\n${neu.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa}: "${r.comentario}"`).join('\n')}`:'' }
${pos.length?`\nPOSITIVOS (${pos.length}):\n${pos.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa}: "${r.comentario}"`).join('\n')}`:'' }
TAREA: 1) Temas críticos que se repiten 2) Sugerencias más frecuentes 3) Lo que más valoran 4) Top 3 acciones prioritarias. Español, ejecutivo.`;
    const ia = await llamarIA(prompt, `Análisis IA P3 · ${etiqueta}`);
    if (ia) {
      document.getElementById('modal-body').innerHTML = renderIABox(ia, items.length) + `
        <div class="report-section" style="margin-top:20px"><h3>Respuestas individuales (${items.length})</h3><div class="report-group">
          ${items.map(r=>`<div class="report-item ${r.cls==='neg'?'negative':r.cls==='pos'?'positive':'neutral'}"><strong>${r.empresa}</strong><br><em style="color:#4A5568">"${r.comentario}"</em></div>`).join('')}
        </div></div>`;
    } else {
      document.getElementById('modal-body').innerHTML =
        `<div style="margin-bottom:16px;padding:12px 16px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;font-size:12px;color:#DC2626;font-weight:500">⚠️ Sin conexión IA — clasificación local</div>` +
        renderFallbackComentarios(neg.map(r=>({...r,nota:undefined})), neu.map(r=>({...r,nota:undefined})), pos.map(r=>({...r,nota:undefined})));
    }
  }

  // ─── REPORTE CSAT (comentario = Col D para reuniones, Col J para abonos) ───
  async function reporteCSAT(filtrados, modulo, etiqueta) {
    const items = filtrados.map(r => ({
      empresa: r.cliente||r.pais||'—', nota: parseFloat(r.puntuacion)||0, comentario: (r.comentario||'').trim()
    })).filter(r => r.comentario);
    const neg = items.filter(r=>r.nota<=3), neu = items.filter(r=>r.nota===3||r.nota===4), pos = items.filter(r=>r.nota>=4);
    const neg2 = items.filter(r=>r.nota<=2), neu2 = items.filter(r=>r.nota===3), pos2 = items.filter(r=>r.nota>=4);
    const prompt = buildPromptCSAT(modulo, etiqueta, neg2, neu2, pos2);
    const ia = await llamarIA(prompt, `Reporte ${modulo} · ${etiqueta}`);
    if (ia) {
      document.getElementById('modal-body').innerHTML = renderIABox(ia, items.length);
    } else {
      document.getElementById('modal-body').innerHTML = `<div style="margin-bottom:16px;padding:12px 16px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;font-size:12px;color:#DC2626;font-weight:500">⚠️ Sin conexión IA — análisis local</div>` + renderFallbackComentarios(neg2,neu2,pos2);
    }
  }

  // ─── REPORTE SALIDAS (queHacerDif = Col L, adicional = Col M) ───
  async function reporteSalidas(filtrados, campo, etiqueta) {
    const preguntas = {
      queHacerDif: '¿Qué podríamos haber hecho diferente para que te quedaras?',
      adicional:   '¿Hay algo adicional que quieras compartir sobre tu experiencia?'
    };
    const titulo = campo==='queHacerDif' ? 'Retención · Col L' : 'Comentarios Adicionales · Col M';

    const items = filtrados
      .map(r => ({ empresa: r.programa||r.pais||'—', comentario: (r[campo]||'').trim() }))
      .filter(r => r.comentario && r.comentario !== '-' && r.comentario.toLowerCase() !== 'n/a' && r.comentario !== '');

    if (!items.length) {
      document.getElementById('modal-title').textContent = `${titulo} · ${etiqueta}`;
      document.getElementById('modal-body').innerHTML = '<div style="text-align:center;padding:40px;color:#9AA0B4;font-size:13px;">Sin respuestas escritas para este corte.</div>';
      openModal(); return;
    }

    const palabrasNeg=['mal','falla','error','demora','caro','problema','falta','nunca','malo','pésimo','difícil','tarde','lento','no funciona'];
    const palabrasPos=['bien','excelente','bueno','genial','satisfecho','feliz','recomend','rápido','fácil','perfecto','increíble'];
    const clsf=txt=>{const t=txt.toLowerCase();const p=palabrasPos.filter(w=>t.includes(w)).length;const n=palabrasNeg.filter(w=>t.includes(w)).length;return n>p?'neg':p>n?'pos':'neu';};

    const neg=items.filter(r=>clsf(r.comentario)==='neg');
    const neu=items.filter(r=>clsf(r.comentario)==='neu');
    const pos=items.filter(r=>clsf(r.comentario)==='pos');

    const prompt = `Eres analista CX senior de Apprecio (plataforma B2B de beneficios en LATAM).
PREGUNTA ANALIZADA: "${preguntas[campo]}"
SECCIÓN: Clientes que salieron | CORTE: ${etiqueta} | TOTAL: ${items.length} respuestas

${neg.length ? `NEGATIVOS (${neg.length}):\n${neg.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa}: "${r.comentario}"`).join('\n')}` : ''}
${neu.length ? `\nNEUTROS / SUGERENCIAS (${neu.length}):\n${neu.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa}: "${r.comentario}"`).join('\n')}` : ''}
${pos.length ? `\nPOSITIVOS (${pos.length}):\n${pos.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa}: "${r.comentario}"`).join('\n')}` : ''}

TAREA: Entrega un resumen ejecutivo con estas 4 secciones:
1. 🔴 NEGATIVOS: patrones que se repiten, qué duele más
2. 🟡 NEUTROS: sugerencias frecuentes, qué están pidiendo
3. 🟢 POSITIVOS: qué valoraron a pesar de irse
4. ⚡ TOP 3 ACCIONES: concretas y priorizadas basadas en los comentarios reales
Responde en español, directo y ejecutivo.`;

    const ia = await llamarIA(prompt, `${titulo} · ${etiqueta}`);
    if (ia) {
      document.getElementById('modal-body').innerHTML =
        renderIABox(ia, items.length) +
        `<div class="report-section" style="margin-top:16px"><h3>Detalle de respuestas (${items.length})</h3><div class="report-group">` +
        neg.map(r=>`<div class="report-item negative"><strong>${r.empresa}</strong><br><em style="color:#4A5568">"${r.comentario}"</em></div>`).join('') +
        neu.map(r=>`<div class="report-item neutral"><strong>${r.empresa}</strong><br><em style="color:#4A5568">"${r.comentario}"</em></div>`).join('') +
        pos.map(r=>`<div class="report-item positive"><strong>${r.empresa}</strong><br><em style="color:#4A5568">"${r.comentario}"</em></div>`).join('') +
        '</div></div>';
    } else {
      document.getElementById('modal-body').innerHTML =
        '<div style="margin-bottom:16px;padding:12px 16px;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;font-size:12px;color:#DC2626;font-weight:500">⚠️ Sin conexión IA — mostrando clasificación local</div>' +
        renderFallbackComentarios(neg.map(r=>({...r,nota:undefined})), neu.map(r=>({...r,nota:undefined})), pos.map(r=>({...r,nota:undefined})));
    }
  }

  // ─── HELPERS PROMPTS Y UI ───
  function buildPromptNPS(modulo, etiqueta, neg, neu, pos) {
    const score = neg.length+pos.length ? Math.round(((pos.length-neg.length)/(neg.length+neu.length+pos.length))*100) : 0;
    return `Eres analista CX senior de Apprecio (B2B beneficios LATAM). MÓDULO: ${modulo} | CORTE: ${etiqueta} | NPS: ${score>0?'+':''}${score} | Total comentarios: ${neg.length+neu.length+pos.length}
${neg.length?`\nDETRACTORES (≤6):\n${neg.slice(0,15).map((r,i)=>`${i+1}. ${r.empresa} (Nota:${r.nota}): "${r.comentario}"`).join('\n')}`:'' }

  // ──────────────────────────────────────────
  // GRÁFICO DONUT
  // ──────────────────────────────────────────
  function ChartDonut({ id, promotores, neutrales, detractores, score, labelCenter }) {
    const ref = useRef(null), chart = useRef(null);
    useEffect(() => {
      if (!ref.current || typeof Chart === 'undefined') return;
      if (chart.current) chart.current.destroy();
      const sinDatos = promotores===0 && neutrales===0 && detractores===0;
      chart.current = new Chart(ref.current.getContext('2d'), {
        type:'doughnut',
        data:{
          labels: sinDatos?['Sin datos']:['Alto','Medio','Bajo'],
          datasets:[{ data: sinDatos?[1]:[promotores,neutrales,detractores], backgroundColor: sinDatos?['#E4E7EB']:['#22C55E','#F59E0B','#FA345E'], borderWidth:0, spacing: sinDatos?0:2, hoverOffset: sinDatos?0:4 }]
        },
        options:{ responsive:true, maintainAspectRatio:false, cutout:'76%', plugins:{ legend:{display:false}, tooltip:{enabled:!sinDatos} } },
        plugins:[{ id:'txt_'+id, beforeDraw(ch){
          const {ctx,width,height}=ch; ctx.save();
          const fh=Math.min(width,height)/5.5;
          ctx.font=`800 ${fh}px DM Sans,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillStyle=sinDatos?'#9AA0B4':'#111827';
          ctx.fillText(sinDatos?'—':(score>0?'+':'')+score, width/2, height/2-5);
          ctx.font=`600 ${fh/2.8}px DM Sans,sans-serif`; ctx.fillStyle='#9AA0B4';
          ctx.fillText(sinDatos?'Sin datos':labelCenter, width/2, height/2+fh/1.5); ctx.restore();
        }}]
      });
      return ()=>{ if(chart.current) chart.current.destroy(); };
    },[promotores,neutrales,detractores,score,labelCenter,id]);
    return e('div',{className:'relative w-full h-[180px]'}, e('canvas',{ref}));
  }

    const palabrasPos=['bien','excelente','bueno','genial','perfecto','rápido','fácil','increíble','satisfecho','feliz','recomend','siempre'];
    const clsf=txt=>{const t=txt.toLowerCase();const p=palabrasPos.filter(w=>t.includes(w)).length;const n=palabrasNeg.filter(w=>t.includes(w)).length;return n>p?'neg':p>n?'pos':'neu';};

  // ──────────────────────────────────────────
  // MÓDULO NPS
  // ──────────────────────────────────────────
  function ModuloNPS({ rawNps, filtroPais, filtroAnio, filtroPeriodo, configPreguntas }) {
    const [histPais, setHistPais] = useState('Todos');
    const [histAnio, setHistAnio] = useState('2026');

   // 1. Extraer el código limpio del Quarter (ej: "Trimestre 2 (Q2)" -> "Q2")
      const keyQ = (filtroPeriodo && filtroPeriodo.includes('(')) 
      ? filtroPeriodo.split('(')[1].replace(')', '').trim() 
      : filtroPeriodo;

    // 2. Definir textos reales de respaldo por si el Sheets no tiene datos en ese Quarter
    let textoBaseP1 = "En una escala del 1 al 10, ¿Qué tanto recomiendas nuestra aplicación Apprecio?";
    let textoBaseP2 = "¿Cómo calificarías la atención del KAM asignado a tu cuenta trimestralmente?";
    let textoBaseP3 = "¿Qué podríamos mejorar o agregar para entregarte más valor?";

    // 3. Buscar de forma inteligente en configPreguntas intentando variaciones (Q2, q2, Trimestre 2 (Q2))
    let configQ = null;
    if (configPreguntas) {
      configQ = configPreguntas[keyQ] || configPreguntas[filtroPeriodo];
      
      if (!configQ) {
        const targetKey = keyQ.toLowerCase();
        const foundKey = Object.keys(configPreguntas).find(k => k.toLowerCase().trim() === targetKey);
        if (foundKey) configQ = configPreguntas[foundKey];
      }
    }

    // 4. Extraer las preguntas mapeando variaciones de mayúsculas en los encabezados de tu Excel
    if (configQ) {
      if (configQ.pregunta1 || configQ.Pregunta1) textoBaseP1 = configQ.pregunta1 || configQ.Pregunta1;
      if (configQ.pregunta2 || configQ.Pregunta2) textoBaseP2 = configQ.pregunta2 || configQ.Pregunta2;
      if (configQ.pregunta3 || configQ.Pregunta3) textoBaseP3 = configQ.pregunta3 || configQ.Pregunta3;
    }

    // 5. Armar los títulos finales dinámicos que van a los componentes
    let tituloP1 = "Pregunta 1: " + textoBaseP1;
    let tituloP2 = "Pregunta 2: " + textoBaseP2;
    let tituloP3 = "Pregunta 3: " + textoBaseP3;

    const {listaPaises,listaMeses,listaAnios}=useMemo(()=>{
      const p=new Set(),m=new Set(),a=new Set();
      rawNps.forEach(r=>{if(r.pais)p.add(r.pais);if(r.mes)m.add(r.mes);if(r.anio)a.add(String(r.anio));});
      return {listaPaises:['Todos',...Array.from(p)],listaMeses:['Todos',...Array.from(m)],listaAnios:Array.from(a).length?Array.from(a):['2026']};
    },[rawNps]);

    const calcMetrica=(arr)=>{
      const total=arr.length; if(!total) return {total:0,p:0,n:0,d:0,score:0,avg:'—',pPorc:0};
      let pr=0,ne=0,de=0,suma=0;
      arr.forEach(r=>{const v=parseFloat(r.puntuacion);if(!isNaN(v)){suma+=v;if(v>=9)pr++;else if(v>=7)ne++;else de++;}});
      return {total,p:pr,n:ne,d:de,score:Math.round(((pr/total)*100)-((de/total)*100)),avg:(suma/total).toFixed(1),pPorc:((pr/total)*100).toFixed(0)};
    };
    const calcMetricaP2=(arr)=>{
      const validos=arr.filter(r=>r.pregunta2!==undefined&&r.pregunta2!==null&&String(r.pregunta2).trim()!=='');
      const total=validos.length; if(!total) return {total:0,p:0,n:0,d:0,score:0,avg:'—',pPorc:0};
      let pr=0,ne=0,de=0,suma=0;
      validos.forEach(r=>{const v=parseFloat(r.pregunta2);if(!isNaN(v)){suma+=v;if(v>=9)pr++;else if(v>=7)ne++;else de++;}});
      return {total,p:pr,n:ne,d:de,score:Math.round(((pr/total)*100)-((de/total)*100)),avg:(suma/total).toFixed(1),pPorc:((pr/total)*100).toFixed(0)};
    };

    const p1f = useMemo(() => {
      return rawNps.filter(r => {
        const pasaPais = (filtroPais === 'Todos' || r.pais === filtroPais);
        const pasaAnio = (filtroAnio === 'Todos' || String(r.anio) === filtroAnio);
        const pasaPeriodo = (filtroPeriodo === 'Todos' || (r.periodoQ && r.periodoQ.includes(filtroPeriodo)));
        return pasaPais && pasaAnio && pasaPeriodo;
      });
    }, [rawNps, filtroPais, filtroAnio, filtroPeriodo]);

    const p2f = p1f;
    const m1=useMemo(()=>calcMetrica(p1f),[p1f]);
    const m2=useMemo(()=>calcMetricaP2(p2f),[p2f]);

    const datosLinea=useMemo(()=>{
      const filtHist=rawNps.filter(r=>(histPais==='Todos'||r.pais===histPais)&&String(r.anio)===histAnio);

  function ModuloCSAT({ abonoRaw, reunionRaw }) {
    const [c1Pais,setC1Pais]=useState('Todos'), [c1Mes,setC1Mes]=useState('Todos');
    const [c2Pais,setC2Pais]=useState('Todos'), [c2Mes,setC2Mes]=useState('Todos');
    const listaPaises=['Todos','Colombia','Mexico','Chile','Peru','Ecuador'];
    const listaMeses=['Todos','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

    const calcCSAT=(arr)=>{
      const total=arr.length; if(!total) return {total:0,p:0,n:0,d:0,score:0,avg:'—',pPorc:0};
      let alto=0,medio=0,bajo=0,suma=0;
      arr.forEach(r=>{const v=parseFloat(r.puntuacion);if(!isNaN(v)){suma+=v;if(v>=4)alto++;else if(v===3)medio++;else bajo++;}});
      return {total,p:alto,n:medio,d:bajo,score:Math.round((alto/total)*100),avg:(suma/total).toFixed(1),pPorc:((alto/total)*100).toFixed(0)};
    };

    const c1f=useMemo(()=>abonoRaw.filter(r=>(c1Pais==='Todos'||r.pais===c1Pais)&&(c1Mes==='Todos'||r.mes===c1Mes)),[abonoRaw,c1Pais,c1Mes]);

    const m1=useMemo(()=>calcCSAT(c1f),[c1f]);
    const m2=useMemo(()=>calcCSAT(c2f),[c2f]);

    const histAbono=useMemo(()=>{
      const meses={}; abonoRaw.forEach(r=>{if(r.mes){const m=r.mes;if(!meses[m])meses[m]=[];meses[m].push(r);}});

    },[abonoRaw]);
    const histReunion=useMemo(()=>{
      const meses={}; reunionRaw.forEach(r=>{if(r.mes){const m=r.mes;if(!meses[m])meses[m]=[];meses[m].push(r);}});
      return Object.keys(meses).map(m=>{let s=0;meses[m].forEach(r=>s+=parseFloat(r.puntuacion)||3);return {q:m,score:+(s/meses[m].length).toFixed(1)};});
    },[reunionRaw]);

    const criticosCSAT=useMemo(()=>[...abonoRaw,...reunionRaw].filter(r=>{const v=parseFloat(r.puntuacion);return !isNaN(v)&&v<=2;}),[abonoRaw,reunionRaw]);

    return e('div',{className:'space-y-6'},

      ),

        totalRespuestas:m1.total,promotores:m1.p,neutrales:m1.n,detractores:m1.d,score:m1.score,promedio:m1.avg,totalPromotores:m1.p,pctPromotores:m1.pPorc,
        listaPaises,listaMeses,filtroPais:c1Pais,setFiltroPais:setC1Pais,filtroMes:c1Mes,setFiltroMes:setC1Mes,
        textoBoton:'Generar reporte de respuestas abiertas', labelCenter:'Satisfechos',

      }),

        e('p',{className:'text-[11px] text-gray-500 mt-0.5'},'Medición de calidad del servicio consultivo al cierre de mesas de trabajo.')
      ),
      e(BloqueEspejo,{
        id:'csat_2',

        totalRespuestas:m2.total,promotores:m2.p,neutrales:m2.n,detractores:m2.d,score:m2.score,promedio:m2.avg,totalPromotores:m2.p,pctPromotores:m2.pPorc,
        listaPaises,listaMeses,filtroPais:c2Pais,setFiltroPais:setC2Pais,filtroMes:c2Mes,setFiltroMes:setC2Mes,

              total>0
                ? filtrados.map((r,i)=>e('tr',{key:i,className:'hover:bg-gray-50/80 transition-colors'},
                    e('td',{className:'p-4 pl-6 font-medium text-gray-500'},r.fecha?new Date(r.fecha).toLocaleDateString('es-CL'):'—'),
                    e('td',{className:'p-4 font-bold text-gray-900'},r.programa||'—'),
                    e('td',{className:'p-4 text-gray-600 font-mono'},r.correo||'—')
                  ))
                : e('tr',null,e('td',{colSpan:3,className:'p-8 text-center text-gray-400 italic'},'No hay desvinculaciones con respuestas registradas.'))
            )
          )
        )
      )
    );
  }

  // ──────────────────────────────────────────
  // APP PRINCIPAL
  // ──────────────────────────────────────────
  function App() {
    const [data,setData]=useState(null);
    const [loading,setLoading]=useState(true);
    const [error,setError]=useState(null);
    const [tab,setTab]=useState(0);
    
    const [filtroPais, setFiltroPais] = useState('Todos');
    const [filtroAnio, setFiltroAnio] = useState(String(new Date().getFullYear()));

    const obtenerQuarterActual = () => {
      const mes = new Date().getMonth();
      if (mes <= 2) return 'Q1';
      if (mes <= 5) return 'Q2';
      if (mes <= 8) return 'Q3';
      return 'Q4';
    };

    const [filtroPeriodo, setFiltroPeriodo] = useState(obtenerQuarterActual());

    const cargar=useCallback(()=>{
      setLoading(true); setError(null);
      fetch(URL_BACKEND)
        .then(r=>{ if(!r.ok) throw new Error('Error servidor'); return r.json(); })
        .then(d=>{ if(!d||typeof d!=='object') throw new Error('Datos inválidos'); setData(d); setLoading(false); })
        .catch(err=>{ setError(err.message); setLoading(false); });
    },[]);
    useEffect(()=>{ cargar(); },[]);

    const tabs=[['NPS','fa-solid fa-chart-line'],['CSAT','fa-solid fa-star'],['Inactivos','fa-solid fa-user-clock'],['Salidas / Off','fa-solid fa-arrow-right-from-bracket']];

    const salidasNorm=useMemo(()=>{
      if(!data||!Array.isArray(data.salidas)) return [];
      return data.salidas.map(o=>({
        pais:               o.pais||'',
        programa:           o.programa||'',
        correo:             o.correo||'',
        motivoSalida:       o.motivoBaja||'',
        fallaExperiencia:   o.fallas||'',
        puntuacionExperiencia: o.experiencia||'',
        puntuacionEjecutivo:   o.notaKam||'',
        queHacerDif:        o.queHacerDif||'',
        adicional:          o.adicional||'',
        volveria:           o.volveria?String(o.volveria).toUpperCase().replace(/Í/g,'I').trim():'',
        estado:             o.estado||'',
        fecha:              o.fecha||null
      }));
    },[data]);

    return e('div',{className:'min-h-screen flex flex-col justify-between'},
      e('div',{},
        e('header',{className:'bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm px-6 py-4'},
          e('div',{className:'max-w-7xl mx-auto flex items-center justify-between'},
            e('div',{className:'flex items-center gap-3'},
              e('div',{className:'w-10 h-10 rounded-xl flex items-center justify-center text-white text-base shadow-md',style:{background:'#FA345E'}},
                e('i',{className:'fa-solid fa-heart-pulse'})
              ),
              e('div',{},
                e('h1',{className:'text-base font-extrabold text-gray-900 leading-none tracking-tight'},'Experiencia del cliente'),
                e('p',{className:'text-[11px] text-gray-400 mt-1 font-medium'},'Métricas sincronizadas en vivo corporativo')
              )
            ),
            e('button',{onClick:cargar,disabled:loading,className:'p-2.5 bg-gray-50 hover:bg-gray-100 rounded-xl text-gray-400 border border-gray-200'},
              e('i',{className:`fa-solid fa-arrow-rotate-right ${loading?'animate-spin':''}`})
            )
          ),
          e('div',{className:'max-w-7xl mx-auto flex gap-6 -mb-4 mt-4 overflow-x-auto'},
            tabs.map(([lbl,icon],id)=>e('button',{key:id,onClick:()=>setTab(id),className:`tab-btn pb-3 text-xs font-bold tracking-wider uppercase whitespace-nowrap flex items-center gap-2 ${tab===id?'active text-brand':'text-gray-400 hover:text-gray-600'}`},
              e('i',{className:icon}),lbl
            ))
          )
        ),
        
        e('div',{className:'max-w-7xl mx-auto px-6 mt-6 w-full'},
          e('div',{className:'bg-white p-4 rounded-2xl border border-gray-200 flex flex-wrap gap-4 items-center justify-between shadow-sm'},
            e('div',{className:'text-xs font-bold text-gray-800 uppercase tracking-wider'},
              e('i',{className:'fa-solid fa-filter text-brand mr-2', style:{color:'#FA345E'}}),
              'Filtros Generales'
            ),
            e('div',{className:'flex flex-wrap gap-3'},
              e('select',{
                value: filtroAnio,
                onChange: ev => { setFiltroAnio(ev.target.value); if(ev.target.value === 'Todos') setFiltroPeriodo('Todos'); },
                className:'p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-700 outline-none'
              },
                e('option',{value:'Todos'},'Todos los Años'),
                e('option',{value:'2025'},'Año 2025'),
                e('option',{value:'2026'},'Año 2026'),
                e('option',{value:'2027'},'Año 2027')
              ),
              e('select',{
                value: filtroPeriodo,
                onChange: ev => setFiltroPeriodo(ev.target.value),
                className:'p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-700 outline-none'
              },
                e('option',{value:'Q1'},'Trimestre 1 (Q1)'),
                e('option',{value:'Q2'},'Trimestre 2 (Q2)'),
                e('option',{value:'Q3'},'Trimestre 3 (Q3)'),
                e('option',{value:'Q4'},'Trimestre 4 (Q4)')
              ),
              e('select',{
                value: filtroPais,
                onChange: ev => setFiltroPais(ev.target.value),
                className:'p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-700 outline-none'
              },
                ['Todos','Peru','Chile','Colombia','Ecuador','Mexico'].map(p => 
                  e('option',{key:p,value:p}, p === 'Todos' ? 'Todos los Países' : p)
                )
              )
            )
          )
        ),

        e('main',{className:'max-w-7xl mx-auto px-6 mt-6 pb-10'},
          loading && e('div',{className:'space-y-5'},
            e('div',{className:'skeleton h-20'}),
            e('div',{className:'grid grid-cols-1 lg:grid-cols-2 gap-6'},e('div',{className:'skeleton h-[300px]'}),e('div',{className:'skeleton h-[300px]'})),
            e('div',{className:'skeleton h-48 w-full'})
          ),
          !loading && error && e('div',{className:'card p-8 text-center max-w-md mx-auto mt-10 space-y-3 bg-white'},
            e('i',{className:'fa-solid fa-triangle-exclamation text-red-500 text-3xl'}),
            e('p',{className:'font-bold text-gray-800'},'Error de conexión'),
            e('p',{className:'text-xs text-gray-400'},error),
            e('button',{onClick:cargar,className:'px-4 py-2 text-white text-xs font-bold rounded-xl',style:{background:'#FA345E'}},'Reintentar')
          ),
          !loading && !error && data && e('div',{},
            tab===0 && e(ModuloNPS,{
              rawNps: Array.isArray(data.nps) ? data.nps : [],
              filtroPais,
              filtroAnio,
              filtroPeriodo,
              configPreguntas: data.configPreguntas || {}
            }),
            tab===1 && e(ModuloCSAT,{abonoRaw:Array.isArray(data.csat_abono)?data.csat_abono:[],reunionRaw:Array.isArray(data.csat_reunion)?data.csat_reunion:[]}),
            tab===2 && e('div',{className:'card p-10 text-center text-gray-500 font-medium space-y-4 bg-white'},
              e('i',{className:'fa-solid fa-user-clock text-4xl block',style:{color:'#FA345E'}}),
              e('h2',{className:'text-sm font-extrabold text-gray-800'},'Análisis de Clientes Inactivos'),
              e('p',{className:'text-xs text-gray-400'},'Sección en desarrollo')
            ),
            tab===3 && e(ModuloSalidas,{
              datos:salidasNorm,
              filtroPais,setFiltroPais,filtroAnio,setFiltroAnio,filtroMes,setFiltroMes
            })
          )
        )
      ),
      e('footer',{className:'text-center py-6 text-[11px] text-gray-400 border-t border-gray-200 bg-white w-full'},'Apprecio · Dashboard Experiencia del cliente · 2026')
    );
  }

  ReactDOM.render(e(App), document.getElementById('root'));
  </script>
</body>
</html>
