<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · Experiencia del cliente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"DM Sans"', 'sans-serif'] },
          colors: {
            brand: { DEFAULT: '#FA345E', light: '#FFF0F3', dark: '#D61F47' },
            success: '#22C55E', warn: '#F59E0B', danger: '#EF4444',
            neutral: { 50: '#F8F9FA', 100: '#F1F3F7', 200: '#E4E7EB', 300: '#CBD1D6', 400: '#9AA0B4', 500: '#6B7280', 700: '#374151', 800: '#1F2937', 900: '#111827' }
          }
        }
      }
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/17.0.2/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/17.0.2/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'DM Sans', sans-serif; background: #F8F9FA; min-height: 100vh; color: #1F2937; }
    .card { background: #ffffff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.03); border: 1px solid #E4E7EB; }
    .tab-btn { position: relative; transition: all 0.2s; }
    .tab-btn::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 3px; background: #FA345E; border-radius: 3px 3px 0 0; transform: scaleX(0); transition: transform 0.2s ease; }
    .tab-btn.active { color: #FA345E; font-weight: 700; }
    .tab-btn.active::after { transform: scaleX(1); }
    .tooltip-box { display: none; position: absolute; z-index: 50; width: 280px; background: #111827; color: #ffffff; padding: 12px; border-radius: 12px; font-size: 11px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); line-height: 1.4; }
    .tooltip-container:hover .tooltip-box { display: block; }

    /* ── MODAL REPORTE PDF (MEJORA AGREGADA) ── */
    .modal-overlay {
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.55); 
      z-index: 500; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: #ffffff; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 760px; 
      max-height: 88vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
    }
    .modal-header {
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 18px 22px; 
      border-bottom: 1.5px solid #E4E7EB; 
      background: #F8F9FA;
    }
    .modal-title {
      font-size: 15px; 
      font-weight: 700; 
      color: #111827;
    }
    .modal-close {
      background: none; 
      border: none; 
      font-size: 20px; 
      cursor: pointer; 
      color: #9AA0B4; 
      line-height: 1; 
      padding: 4px 8px; 
      border-radius: 6px; 
      transition: background 0.15s;
    }
    .modal-close:hover {
      background: #E4E7EB; 
      color: #111827;
    }
    .modal-body {
      flex: 1; 
      overflow-y: auto; 
      padding: 24px;
    }
    .modal-footer {
      display: flex; 
      gap: 10px; 
      justify-content: flex-end; 
      padding: 16px 22px; 
      border-top: 1.5px solid #E4E7EB; 
      background: #F8F9FA;
    }

    /* Contenido interno del Reporte */
    .report-section {
      margin-bottom: 24px;
    }
    .report-section h3 {
      font-size: 13px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: .07em; 
      color: #FA345E; 
      margin-bottom: 12px; 
      padding-bottom: 6px; 
      border-bottom: 2px solid #FFF0F3;
    }
    .report-group {
      display: flex; 
      flex-direction: column; 
      gap: 10px;
    }
    .report-item {
      padding: 12px 16px; 
      border-radius: 8px; 
      border: 1px solid #E4E7EB; 
      background: #F8F9FA; 
      font-size: 13px; 
      line-height: 1.6; 
      color: #374151;
    }
    .report-item.negative {
      border-left: 3px solid #EF4444; 
      background: #FEF2F2;
    }
    .report-item.neutral {
      border-left: 3px solid #F59E0B; 
      background: #FFFBEB;
    }
    .report-item.positive {
      border-left: 3px solid #10B981; 
      background: #F0FDF4;
    }
    .action-item {
      padding: 12px 16px; 
      border-radius: 8px; 
      border: 1px solid #FFF0F3; 
      background: #FFF0F3; 
      font-size: 13px; 
      line-height: 1.6; 
      color: #111827;
    }
    .action-item::before {
      content: '→ '; 
      color: #FA345E; 
      font-weight: 700;
    }
    .spinner-dark {
      display: inline-block; 
      width: 13px; 
      height: 13px; 
      border: 2px solid rgba(26,26,46,0.2); 
      border-top-color: #FA345E; 
      border-radius: 50%; 
      animation: spin .65s linear infinite; 
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Reporte de Respuestas Abiertas</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <p style="color: #6B7280; font-size: 13px;">El contenido del reporte se cargará aquí.</p>
      </div>
      <div class="modal-footer">
        <button class="px-4 py-2 bg-gray-100 text-gray-700 font-bold rounded-xl text-xs uppercase" onclick="closeModal()">Cerrar</button>
        <button class="px-4 py-2 bg-brand text-white font-bold rounded-xl text-xs uppercase" onclick="alert('Funcionalidad de impresión en desarrollo')">
          Descargar PDF
        </button>
      </div>
    </div>
  </div>

  <script>
    const e = React.createElement;
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    const CONFIG_FRONTEND = {
      URL_API_BACKEND: "https://script.google.com/macros/s/AKfycbx3TEMFdxbYGKZFhF5GSZstiiV6vivCCbLq9L7A2iq5oq6DgrVyM6Q3a5Wd_JLAhbT1Wg/exec"
    };

    // --- ENTRADA DE GENERACIÓN DE REPORTE COMPILADO EN PDF ---
    // --- MOTOR DE SÍNTESIS SEMÁNTICA AVANZADO PARA EL REPORTE PDF ---
    const generarPDFResumenEjecutivo = async (idGoogleSheet, modulo, especificacion) => {
      if (!idGoogleSheet) {
        alert("No se configuró el ID del Google Sheet para este segmento.");
        return;
      }

      // 1. Llamamos a n8n enviando de forma dinámica el ID del Sheet y el nombre del módulo
      const respuestaN8N = await fetch("TU_URL_DE_WEBHOOK_N8N", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ 
          sheet_id: idGoogleSheet, 
          seccion: modulo 
        })
      });

      const datos = await respuestaN8N.json();
      const textoResumenIA = datos.resumen; // Aquí se guarda lo que redactó Ollama
      const totalCasos = datos.total_encuestas || 0;

      // 2. Abrimos la ventana del PDF con tu diseño original intacto
      const docVentana = window.open('', '_blank');
      docVentana.document.write(`
        <html>
        <head>
          <title>Informe Consolidado - ${modulo}</title>
          <style>
            body { font-family: 'DM Sans', sans-serif; padding: 50px; color: #2D3748; background: #FFFFFF; line-height: 1.6; }
            .header-strip { border-bottom: 3px solid #FA345E; padding-bottom: 20px; margin-bottom: 35px; }
            .main-title { font-size: 24px; font-weight: 800; color: #1A202C; letter-spacing: -0.5px; }
            .meta-info { font-size: 11px; color: #718096; margin-top: 6px; font-weight: 600; text-transform: uppercase; }
            .grid-kpi { display: flex; gap: 20px; margin-bottom: 35px; }
            .kpi-card-pdf { background: #F7FAFC; border: 1px solid #E2E8F0; padding: 18px; border-radius: 14px; flex: 1; }
            .kpi-title-pdf { font-size: 10px; font-weight: 700; color: #A0AEC0; letter-spacing: 0.5px; text-transform: uppercase; }
            .kpi-value-pdf { font-size: 22px; font-weight: 800; color: #FA345E; margin-top: 4px; }
            .section-label { font-size: 12px; font-weight: 800; color: #1A202C; border-left: 4px solid #FA345E; padding-left: 10px; margin-top: 35px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
            .container-box { background: #FFFFFF; border: 1px solid #E2E8F0; padding: 25px; border-radius: 14px; font-size: 13.5px; white-space: pre-line; color: #4A5568; }
            .action-bar { background: #FA345E; color: #FFFFFF; padding: 12px 24px; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(250,52,94,0.15); }
            @media print { .action-bar { display: none; } }
          </style>
        </head>
        <body>
          <button class="action-bar" onclick="window.print()">Imprimir o Guardar como PDF</button>
          <div class="header-strip">
            <div class="main-title">Análisis Corporativo Sinterizado de Experiencia</div>
            <div class="meta-info">Módulo: ${modulo} | Segmentación: ${especificacion} | Emisión: Suite Apprecio 2026</div>
          </div>
          <div class="grid-kpi">
            <div class="kpi-card-pdf">
              <div class="kpi-title-pdf">Volumen de Feedback Evaluado</div>
              <div class="kpi-value-pdf">${totalCasos} Encuestas Activas</div>
            </div>
            <div class="kpi-card-pdf">
              <div class="kpi-title-pdf">Modelo de Consolidación Narrativa</div>
              <div class="kpi-value-pdf" style="color: #22C55E;">Inteligencia Artificial Local</div>
            </div>
          </div>
          <div class="section-label">Resumen Ejecutivo de Texto Coherente</div>
          <div class="container-box" style="background: #FFFBFB; border-color: #FA345E/20; font-weight: 500; color: #2D3748;">
            ${textoResumenIA}
          </div>
          <div style="margin-top: 60px; text-align: center; font-size: 11px; color: #A0AEC0; border-top: 1px solid #EDF2F7; padding-top: 20px; font-weight: 500;">
            Suite Corporativa Apprecio · Control de Experiencia del Cliente · 2026
          </div>
        </body>
        </html>
      `);
      docVentana.document.close();
    };

    // --- GRÁFICO DONUT ---
    function ChartDonut({ id, promotores, neutrales, detractores, score, labelCenter }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || typeof Chart === 'undefined') return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Alto / Promotores', 'Medio / Neutrales', 'Bajo / Detractores'],
            datasets: [{
              data: [promotores, neutrales, detractores],
              backgroundColor: ['#22C55E', '#F59E0B', '#EF4444'],
              borderWidth: 3,
              borderColor: '#ffffff',
              hoverOffset: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: true } }
          },
          plugins: [{
            id: 'textCenter_' + id,
            beforeDraw: (chart) => {
              const { ctx, width, height } = chart;
              ctx.save();
              const fontHeight = Math.min(width, height) / 5.5;
              ctx.font = `800 ${fontHeight}px DM Sans, sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#111827';
              ctx.fillText((score > 0 ? '+' : '') + score, width / 2, height / 2 - 5);
              ctx.font = `600 ${fontHeight/2.8}px DM Sans, sans-serif`;
              ctx.fillStyle = '#9AA0B4';
              ctx.fillText(labelCenter, width / 2, height / 2 + fontHeight/1.5);
              ctx.restore();
            }
          }]
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [promotores, neutrales, detractores, score, labelCenter, id]);

      return e('div', { className: 'relative w-full h-[180px]' }, e('canvas', { ref: canvasRef }));
    }

    // --- GRÁFICO TENDENCIA DOBLE LÍNEA (CSAT UNIFICADO) ---
    function ChartLineaDobleCSAT({ datosAbono, datosReunion }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || typeof Chart === 'undefined') return;
        if (chartRef.current) chartRef.current.destroy();

        const qsSet = new Set([...datosAbono.map(d => d.q), ...datosReunion.map(d => d.q)]);
        const labels = Array.from(qsSet).sort();

        const dataA = labels.map(l => { const f = datosAbono.find(d => d.q === l); return f ? f.score : null; });
        const dataR = labels.map(l => { const f = datosReunion.find(d => d.q === l); return f ? f.score : null; });

        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'CSAT Post Abonos (Plataforma)',
                data: dataA,
                borderColor: '#4361EE',
                borderWidth: 3,
                tension: 0.25,
                pointBackgroundColor: '#4361EE',
                pointRadius: 4
              },
              {
                label: 'CSAT Post Reuniones (Comercial)',
                data: dataR,
                borderColor: '#FA345E',
                borderWidth: 3,
                tension: 0.25,
                pointBackgroundColor: '#FA345E',
                pointRadius: 4
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { min: 1, max: 10, grid: { color: '#F1F3F7' }, ticks: { font: { family: 'DM Sans' } } },
              x: { grid: { display: false }, ticks: { font: { family: 'DM Sans', weight: 'bold' } } }
            },
            plugins: { legend: { display: true, position: 'top', labels: { font: { family: 'DM Sans', size: 11, weight: 'bold' } } } }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [datosAbono, datosReunion]);

      return e('div', { className: 'w-full h-[250px]' }, e('canvas', { ref: canvasRef }));
    }

    // --- GRÁFICO LÍNEA TENDENCIA SIMPLE (NPS) ---
    function ChartLineaHistorico({ datos }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || typeof Chart === 'undefined') return;
        if (chartRef.current) chartRef.current.destroy();

        const ctx = canvasRef.current.getContext('2d');
        chartRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: datos.map(d => d.q),
            datasets: [{
              label: 'NPS Score',
              data: datos.map(d => d.score),
              borderColor: '#FA345E',
              backgroundColor: 'rgba(250, 52, 94, 0.04)',
              borderWidth: 3,
              tension: 0.3,
              fill: true,
              pointBackgroundColor: '#FA345E',
              pointRadius: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: { min: -100, max: 100, ticks: { font: { family: 'DM Sans' } } },
              x: { ticks: { font: { family: 'DM Sans', weight: 'bold' } } }
            },
            plugins: { legend: { display: false } }
          }
        });

        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [datos]);

      return e('div', { className: 'w-full h-[240px]' }, e('canvas', { ref: canvasRef }));
    }

    // --- RECUADRO ESPEJO DE CONTROL OPERATIVO ---
    function BloquePreguntaEspejo({ id, tituloCompleto, totalRespuestas, promotores, neutrales, detractores, score, promedio, totalPromotores, porcentajePromotores, listaPaises, listaMeses, filtroPais, setFiltroPais, filtroMes, setFiltroMes, textoBoton, labelScoreCenter, onExportar }) {
      return e('div', { className: 'card p-6 flex flex-col md:flex-row gap-6 bg-white' },
        e('div', { className: 'w-full md:w-7/12 flex flex-col justify-between border-r border-gray-100 pr-0 md:pr-4' },
          e('div', { className: 'flex justify-between items-start mb-4 gap-4' },
            e('div', { className: 'flex-1 min-w-0' },
              e('h3', { className: 'text-sm font-bold text-gray-900 leading-snug break-words' }, tituloCompleto),
              e('p', { className: 'text-[11px] font-semibold text-gray-400 uppercase mt-1' }, `Basado en ${totalRespuestas} respuestas reales`)
            ),
            e('div', { className: 'flex gap-1.5 flex-shrink-0' },
              e('select', { value: filtroPais, onChange: ev => setFiltroPais(ev.target.value), className: 'text-[10px] font-bold text-gray-500 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none' },
                listaPaises.map(p => e('option', { key: p, value: p }, p === 'Todos' ? 'País: Todos' : p))
              ),
              e('select', { value: filtroMes, onChange: ev => setFiltroMes(ev.target.value), className: 'text-[10px] font-bold text-gray-500 bg-gray-50 border border-gray-200 rounded-lg px-2 py-1 outline-none' },
                listaMeses.map(m => e('option', { key: m, value: m }, m === 'Todos' ? 'Mes: Todos' : m))
              )
            )
          ),
          totalRespuestas === 0 ? e('div', { className: 'h-[180px] flex items-center justify-center text-xs text-gray-400' }, 'Sin registros en este corte') :
          e(ChartDonut, { id, promotores, neutrales, detractores, score, labelCenter: labelScoreCenter }),
          
          e('div', { className: 'flex justify-around mt-4 text-center text-xs border-t border-gray-50 pt-3' },
            [['Alto / Satisfecho', 'text-green-600', promotores], ['Medio / Neutral', 'text-amber-500', neutrales], ['Bajo / Crítico', 'text-red-500', detractores]].map(([lbl, clr, cant]) => 
              e('div', { key: lbl },
                e('p', { className: `font-bold ${clr} text-sm` }, cant),
                e('p', { className: 'text-[10px] text-gray-400 font-medium' }, lbl)
              )
            )
          )
        ),
        e('div', { className: 'w-full md:w-5/12 flex flex-col justify-between pl-0 md:pl-2' },
          e('div', { className: 'space-y-4' },
            e('h4', { className: 'text-[10px] font-bold text-gray-400 uppercase tracking-wider' }, 'Consolidado General'),
            e('div', { className: 'grid grid-cols-2 gap-3' },
              e('div', { className: 'bg-gray-50/60 p-4 rounded-xl border border-gray-100' },
                e('p', { className: 'text-[11px] font-medium text-gray-400' }, 'Promedio Métrica'),
                e('p', { className: 'text-xl font-extrabold text-gray-800 mt-1' }, promedio),
                e('p', { className: 'text-[9px] text-gray-400 mt-0.5 font-medium' }, 'Filtro Activo')
              ),
              e('div', { className: 'bg-gray-50/60 p-4 rounded-xl border border-gray-100' },
                e('p', { className: 'text-[11px] font-medium text-gray-400' }, 'Casos Destacados'),
                e('p', { className: 'text-xl font-extrabold text-green-600 mt-1' }, totalPromotores),
                e('p', { className: 'text-[9px] text-gray-400 mt-0.5 font-medium' }, `${porcentajePromotores}% de este corte`)
              )
            )
          ),
          e('button', { onClick: onExportar, className: 'w-full mt-6 p-3 bg-brand hover:bg-brand-dark text-white rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 shadow-md shadow-red-100 transition-colors' },
            e('i', { className: 'fa-solid fa-file-pdf' }),
            textoBoton
          )
        )
      );
    }

    // ==========================================
    // --- PESTAÑA 1: MÓDULO CENTRAL NPS ---
    // ==========================================
    function ModuleNPS({ rawNps, metaHeaders }) {
      const [p1Pais, setP1Pais] = useState('Todos'); const [p1Mes, setP1Mes] = useState('Todos');
      const [p2Pais, setP2Pais] = useState('Todos'); const [p2Mes, setP2Mes] = useState('Todos');
      const [histPais, setHistPais] = useState('Todos'); const [histAnio, setHistAnio] = useState('2026');

      // Preguntas dinámicas resueltas según el mes (Iteración 2)
      const getPregunta1Dinamica = (mesSeleccionado) => {
        if(mesSeleccionado === 'Mayo' || mesSeleccionado === 'Todos') return "Pregunta 1: En una escala del 1 al 10, ¿Qué tanto recomiendas nuestra aplicación Apprecio?";
        return metaHeaders.puntuacion || "Pregunta 1: Recommendation de Marca (NPS)";
      };

      const getPregunta2Dinamica = (mesSeleccionado) => {
        if(mesSeleccionado === 'Mayo' || mesSeleccionado === 'Todos') return "Pregunta 2: ¿Cómo calificarías la atención del KAM asignado a tu cuenta trimestralmente?";
        return metaHeaders.pregunta2 || "Pregunta 2: Evaluación Operativa (KAM)";
      };

      const { listPaises, listMeses, listAnios } = useMemo(() => {
        const p = new Set(), m = new Set(), a = new Set();
        rawNps.forEach(r => { if (r.pais) p.add(r.pais); if (r.mes) m.add(r.mes); if (r.anio) a.add(String(r.anio)); });
        return { listPaises: ['Todos', ...Array.from(p)], listMeses: ['Todos', ...Array.from(m)], listAnios: Array.from(a).length > 0 ? Array.from(a) : ['2026'] };
      }, [rawNps]);

      const p1Filtrados = useMemo(() => rawNps.filter(r => (p1Pais === 'Todos' || r.pais === p1Pais) && (p1Mes === 'Todos' || r.mes === p1Mes)), [rawNps, p1Pais, p1Mes]);
      const m1 = useMemo(() => {
        const total = p1Filtrados.length; if (total === 0) return { total: 0, p: 0, n: 0, d: 0, score: 0, avg: '—', pPorc: 0 };
        let prom = 0, neut = 0, detr = 0, suma = 0;
        p1Filtrados.forEach(r => { const v = parseFloat(r.puntuacion); if (!isNaN(v)) { suma += v; if (v >= 9) prom++; else if (v >= 7) neut++; else detr++; } });
        return { total, p: prom, n: neut, d: detr, score: Math.round(((prom/total)*100) - ((detr/total)*100)), avg: (suma/total).toFixed(1), pPorc: ((prom/total)*100).toFixed(0) };
      }, [p1Filtrados]);

      const p2Filtrados = useMemo(() => rawNps.filter(r => (p2Pais === 'Todos' || r.pais === p2Pais) && (p2Mes === 'Todos' || r.mes === p2Mes)), [rawNps, p2Pais, p2Mes]);
      const m2 = useMemo(() => {
        const validos = p2Filtrados.filter(r => r.pregunta2 !== undefined && r.pregunta2 !== null && r.pregunta2 !== '');
        const total = validos.length; if (total === 0) return { total: 0, p: 0, n: 0, d: 0, score: 0, avg: '—', pPorc: 0 };
        let prom = 0, neut = 0, detr = 0, suma = 0;
        validos.forEach(r => { const v = parseFloat(r.pregunta2); if (!isNaN(v)) { suma += v; if (v >= 9) prom++; else if (v >= 7) neut++; else detr++; } });
        return { total, p: prom, n: neut, d: detr, score: Math.round(((prom/total)*100) - ((detr/total)*100)), avg: (suma/total).toFixed(1), pPorc: ((prom/total)*100).toFixed(0) };
      }, [p2Filtrados]);

      const datosLinea = useMemo(() => {
        const filtradosHist = rawNps.filter(r => (histPais === 'Todos' || r.pais === histPais) && (String(r.anio) === histAnio));
        const qsMap = {}; filtradosHist.forEach(r => { if (r.periodoQ) { if (!qsMap[r.periodoQ]) qsMap[r.periodoQ] = []; qsMap[r.periodoQ].push(r); } });
        return Object.keys(qsMap).sort().map(qName => {
          const arr = qsMap[qName]; let p = 0, d = 0, tot = arr.length;
          arr.forEach(r => { const v = parseFloat(r.puntuacion); if (!isNaN(v)) { if (v >= 9) p++; else if (v < 7) d++; } });
          return { q: qName, score: tot > 0 ? Math.round(((p / tot) * 100) - ((d / tot) * 100)) : 0 };
        });
      }, [rawNps, histPais, histAnio]);

      const criticos = useMemo(() => rawNps.filter(r => { const n = parseFloat(r.puntuacion); return !isNaN(n) && n <= 6; }), [rawNps]);

      return e('div', { className: 'space-y-6' },
        e('div', { className: 'grid grid-cols-1 xl:grid-cols-2 gap-6' },
          e(BloquePreguntaEspejo, {
            id: 'nps_p1', tituloCompleto: getPregunta1Dinamica(p1Mes),
            totalRespuestas: m1.total, promotores: m1.p, neutrales: m1.n, detractores: m1.d, score: m1.score, promedio: m1.avg, totalPromotores: m1.p, porcentajePromotores: m1.pPorc,
            listaPaises: listPaises, listaMeses: listMeses, filtroPais: p1Pais, setFiltroPais: setP1Pais, filtroMes: p1Mes, setFiltroMes: setP1Mes,
            textoBoton: 'Generar reporte de respuestas abiertas', labelScoreCenter: 'NPS Score',
            onExportar: () => generarPDFResumenEjecutivo(p1Filtrados, 'NPS P1', `Corte ${p1Pais} / ${p1Mes}`)
          }),
          e(BloquePreguntaEspejo, {
            id: 'nps_p2', tituloCompleto: getPregunta2Dinamica(p2Mes),
            totalRespuestas: m2.total, promotores: m2.p, neutrales: m2.n, detractores: m2.d, score: m2.score, promedio: m2.avg, totalPromotores: m2.p, porcentajePromotores: m2.pPorc,
            listaPaises: listPaises, listaMeses: listMeses, filtroPais: p2Pais, setFiltroPais: setP2Pais, filtroMes: p2Mes, setFiltroMes: setP2Mes,
            textoBoton: 'Generar reporte de respuestas abiertas', labelScoreCenter: 'Operativo',
            onExportar: () => generarPDFResumenEjecutivo(p2Filtrados, 'NPS P2', `Corte ${p2Pais} / ${p2Mes}`)
          })
        ),
        e('div', { className: 'card p-6 bg-white flex flex-col md:flex-row gap-6' },
          e('div', { className: 'w-full md:w-8/12' },
            e('div', { className: 'flex items-center gap-2 mb-4' },
              e('h3', { className: 'text-sm font-bold text-gray-900' }, 'Evolución Histórica de Tendencia por Trimestre (Qs)'),
              e('div', { className: 'tooltip-container relative inline-block cursor-help' },
                e('i', { className: 'fa-solid fa-circle-info text-gray-300 hover:text-brand text-xs' }),
                e('div', { className: 'tooltip-box shadow-xl' },
                  e('p', { className: 'font-bold border-b border-gray-700 pb-1 mb-1' }, '¿Qué significa el Score NPS?'),
                  e('p', {}, 'Se calcula restando el % de Promotores (9-10) menos el % de Detractores (0-6).')
                )
              )
            ),
            datosLinea.length === 0 ? e('div', { className: 'h-[240px] flex items-center justify-center text-xs text-gray-400' }, 'Sin históricos en este corte') : e(ChartLineaHistorico, { datos: datosLinea })
          ),
          e('div', { className: 'w-full md:w-4/12 flex flex-col justify-between border-l border-gray-100 pl-0 md:pl-6' },
            e('div', { className: 'space-y-4' },
              e('h4', { className: 'text-[10px] font-bold text-gray-400 uppercase tracking-wider' }, 'Filtros de Tendencia'),
              e('div', { className: 'space-y-3' },
                e('div', { className: 'space-y-1' }, e('label', { className: 'text-[11px] text-gray-400 font-medium' }, 'País:'), e('select', { value: histPais, onChange: ev => setHistPais(ev.target.value), className: 'w-full text-xs font-semibold text-gray-600 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none' }, listPaises.map(p => e('option', { key: p, value: p }, p)))),
                e('div', { className: 'space-y-1' }, e('label', { className: 'text-[11px] text-gray-400 font-medium' }, 'Año Fiscal:'), e('select', { value: histAnio, onChange: ev => setHistAnio(ev.target.value), className: 'w-full text-xs font-semibold text-gray-600 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none' }, listAnios.map(a => e('option', { key: a, value: a }, a))))
              )
            )
          )
        ),
        e('div', { className: 'card p-6 bg-white' },
          e('div', { className: 'flex justify-between items-center mb-4' },
            e('h3', { className: 'text-sm font-bold text-red-600 flex items-center gap-1.5' }, e('i', { className: 'fa-solid fa-triangle-exclamation animate-pulse' }), 'Radar de Alertas Avanzado · Control de Clientes Críticos'),
            e('span', { className: 'px-2.5 py-1 bg-red-50 text-red-600 text-xs font-extrabold rounded-full' }, `${criticos.length} Casos`)
          ),
          criticos.length === 0 ? e('p', { className: 'text-center py-6 text-xs text-gray-400' }, '¡Felicidades! Sin alertas críticas 🎉') :
          e('div', { className: 'space-y-2' }, criticos.map((c, i) => {
            const txtColM = (c.notaKam || '').trim();
            const gestionado = txtColM.toLowerCase().includes('comunic') || txtColM.toLowerCase().includes('hablo') || txtColM.toLowerCase().includes('ok') || txtColM.toLowerCase().includes('si');
            return e('div', { key: i, className: 'p-4 rounded-xl border border-red-100 bg-red-50/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 text-xs' },
              e('div', {}, e('p', { className: 'font-extrabold text-gray-900' }, `${c.cliente || 'Empresa'} (${c.pais || '—'})`), e('p', { className: 'text-gray-500 italic mt-0.5' }, c.razon ? `"${c.razon}"` : '—')),
              e('div', { className: 'text-right flex-shrink-0' }, e('span', { className: 'px-2 py-0.5 bg-red-500 text-white font-bold rounded' }, `Nota: ${c.puntuacion}`), e('p', { className: `font-bold mt-1 ${gestionado ? 'text-green-600' : 'text-amber-500'}` }, txtColM || 'Sin observaciones registradas'))
            );
          }))
        )
      );
    }

    // ==========================================
    // --- PESTAÑA 2: MÓDULO CSAT REFLEXIVO ---
    // ==========================================
    function ModuleCSAT({ abonoRaw, reunionRaw }) {
      const [c1Pais, setC1Pais] = useState('Todos'); const [c1Mes, setC1Mes] = useState('Todos');
      const [c2Pais, setC2Pais] = useState('Todos'); const [c2Mes, setC2Mes] = useState('Todos');

      const listPaises = ['Todos', 'Colombia', 'México', 'Chile', 'Perú', 'Ecuador'];
      const listMeses = ['Todos', 'Mayo', 'Junio', 'Julio', 'Agosto'];

      // CSAT 1 (Abonos) - Computado sobre tus 21 respuestas reales
      const c1Filtrados = useMemo(() => abonoRaw.filter(r => (c1Pais === 'Todos' || r.pais === c1Pais) && (c1Mes === 'Todos' || r.mes === c1Mes)), [abonoRaw, c1Pais, c1Mes]);
      const m1 = useMemo(() => {
        const total = c1Filtrados.length; if (total === 0) return { total: 0, p: 0, n: 0, d: 0, score: 0, avg: '—', pPorc: 0 };
        let alto = 0, medio = 0, bajo = 0, suma = 0;
        c1Filtrados.forEach(r => { 
          const v = parseFloat(r.puntuacion || 10); suma += v;
          if (v >= 9) alto++; else if (v >= 7) medio++; else bajo++;
        });
        return { total, p: alto, n: medio, d: bajo, score: Math.round((alto/total)*100), avg: (suma/total).toFixed(1), pPorc: ((alto/total)*100).toFixed(0) };
      }, [c1Filtrados]);

      // CSAT 2 (Reuniones)
      const c2Filtrados = useMemo(() => reunionRaw.filter(r => (c2Pais === 'Todos' || r.pais === c2Pais) && (c2Mes === 'Todos' || r.mes === c2Mes)), [reunionRaw, c2Pais, c2Mes]);
      const m2 = useMemo(() => {
        const total = c2Filtrados.length; if (total === 0) return { total: 0, p: 0, n: 0, d: 0, score: 0, avg: '—', pPorc: 0 };
        let alto = 0, medio = 0, bajo = 0, suma = 0;
        c2Filtrados.forEach(r => {
          const v = parseFloat(r.puntuacion || 5); suma += v;
          if (v >= 4) alto++; else if (v === 3) medio++; else bajo++;
        });
        return { total, p: alto, n: medio, d: bajo, score: Math.round((alto/total)*100), avg: (suma/total).toFixed(1), pPorc: ((alto/total)*100).toFixed(0) };
      }, [c2Filtrados]);

      // Históricos unificados
      const histAbono = useMemo(() => {
        const qs = {}; abonoRaw.forEach(r => { if(r.mes) { const q = r.mes === 'Mayo'?'Q2':'Q3'; if(!qs[q]) qs[q]=[]; qs[q].push(r); } });
        return Object.keys(qs).map(q => { let s=0; qs[q].forEach(r=>s+=parseFloat(r.puntuacion||9)); return { q, score: (s/qs[q].length || 9) }; });
      }, [abonoRaw]);

      const histReunion = useMemo(() => {
        const qs = {}; reunionRaw.forEach(r => { if(r.mes) { const q = r.mes === 'Mayo'?'Q2':'Q3'; if(!qs[q]) qs[q]=[]; qs[q].push(r); } });
        return Object.keys(qs).map(q => { let s=0; qs[q].forEach(r=>s+=parseFloat(r.puntuacion||5)); return { q, score: (s/qs[q].length || 5) }; });
      }, [reunionRaw]);

      const criticosCSAT = useMemo(() => {
        return [...abonoRaw, ...reunionRaw].filter(r => { const v = parseFloat(r.puntuacion); return !isNaN(v) && (v <= 6 || v <= 3); });
      }, [abonoRaw, reunionRaw]);

      return e('div', { className: 'space-y-6' },
        e('div', { className: 'card p-4 bg-brand/5 border border-brand/10 -mb-2' },
          e('h3', { className: 'text-xs font-bold text-brand uppercase tracking-wider' }, 'Sección Horizontal 1 · CSAT Post Abono Trimestral'),
          e('p', { className: 'text-[11px] text-gray-500 mt-0.5' }, 'Evaluación gatillada tras la confirmación de abonos trimestrales en la plataforma financiera.')
        ),
        e(BloquePreguntaEspejo, {
          id: 'csat_1', tituloCompleto: '¿Qué tan satisfecho(a) estás con el uso de la plataforma para la gestión de tus abonos trimestrales?',
          totalRespuestas: m1.total, promotores: m1.p, neutrales: m1.n, detractores: m1.d, score: m1.score, promedio: m1.avg, totalPromotores: m1.p, porcentajePromotores: m1.pPorc,
          listaPaises: listPaises, listaMeses: listMeses, filtroPais: c1Pais, setFiltroPais: setC1Pais, filtroMes: c1Mes, setFiltroMes: setC1Mes,
          textoBoton: 'Generar reporte de respuestas abiertas', labelScoreCenter: 'Satisfechos',
          onExportar: () => generarPDFResumenEjecutivo(c1Filtrados, 'CSAT 1 - Post Abono', `Corte ${c1Pais}`)
        }),

        e('div', { className: 'card p-4 bg-brand/5 border border-brand/10 -mb-2' },
          e('h3', { className: 'text-xs font-bold text-brand uppercase tracking-wider' }, 'Sección Horizontal 2 · CSAT Post Reunión Comercial'),
          e('p', { className: 'text-[11px] text-gray-500 mt-0.5' }, 'Medición de calidad del servicio consultivo ejecutada inmediatamente al cierre de mesas de trabajo.')
        ),
        e(BloquePreguntaEspejo, {
          id: 'csat_2', tituloCompleto: '¿El ejecutivo comercial resolvió de forma clara y oportuna tus requerimientos en la reunión de cuenta?',
          totalRespuestas: m2.total, promotores: m2.p, neutrales: m2.n, detractores: m2.d, score: m2.score, promedio: m2.avg, totalPromotores: m2.p, porcentajePromotores: m2.pPorc,
          listaPaises: listPaises, listaMeses: listMeses, filtroPais: c2Pais, setFiltroPais: setC2Pais, filtroMes: c2Mes, setFiltroMes: setC2Mes,
          textoBoton: 'Generar reporte de respuestas abiertas', labelScoreCenter: 'Satisfechos',
          onExportar: () => generarPDFResumenEjecutivo(c2Filtrados, 'CSAT 2 - Post Reunión', `Corte ${c2Pais}`)
        }),

        e('div', { className: 'card p-6 bg-white' },
          e('h4', { className: 'text-sm font-bold text-gray-900 mb-4' }, 'Evolución Histórica de Tendencia CSAT (Líneas Comparativas)'),
          e(ChartLineaDobleCSAT, { datosAbono: histAbono, datosReunion: histReunion })
        ),

        e('div', { className: 'card p-6 bg-white' },
          e('h4', { className: 'text-sm font-bold text-red-600 mb-3' }, 'Radar de Alertas Críticas · CSAT'),
          criticosCSAT.length === 0 ? e('p', { className: 'text-xs text-gray-400 py-4 text-center' }, 'No hay alertas de insatisfacción críticas en este bloque.') :
          e('div', { className: 'space-y-2' }, criticosCSAT.map((c, i) => 
            e('div', { key: i, className: 'p-3 rounded-lg border border-red-100 bg-red-50/5 flex justify-between text-xs' },
              e('div', {}, e('p', { className: 'font-bold' }, c.cliente || 'Empresa'), e('p', { className: 'text-gray-400 italic' }, c.comentario || 'Sin comentario de texto')),
              e('span', { className: 'font-bold text-red-500' }, `Nota: ${c.puntuacion || '—'}`)
            )
          ))
        )
      );
    }

    // --- ANÁLISIS DE CLIENTES INACTIVOS Y OFFBOARDING ---
    function PlaceholderTab({ title, icon, dataRaw }) {
      return e('div', { className: 'card p-10 text-center text-gray-500 font-medium space-y-4 bg-white' },
        e('i', { className: `fa-solid ${icon} text-4xl text-brand block` }),
        e('h2', { className: 'text-sm font-extrabold text-gray-800' }, title),
        e('div', { className: 'bg-gray-50 p-4 rounded-xl font-mono text-[10px] text-gray-600 text-left overflow-x-auto max-w-xl mx-auto border border-gray-100' },
          JSON.stringify(dataRaw, null, 2)
        )
      );
    }

    function App() {
      const [data, setData] = useState(null); const [metaHeaders, setMetaHeaders] = useState({});
      const [loading, setLoading] = useState(true); const [error, setError] = useState(null);
      const [tab, setTab] = useState(0);

      const cargarData = useCallback(() => {
        setLoading(true); setError(null);
        fetch(CONFIG_FRONTEND.URL_API_BACKEND)
          .then(res => { if (!res.ok) throw new Error("Fallo de respuesta del servidor."); return res.json(); })
          .then(parsed => { if (!parsed || typeof parsed !== 'object') throw new Error("Esquema corrupto."); setData(parsed); setMetaHeaders(parsed.headers || {}); setLoading(false); })
          .catch(err => { setError(err.message || "Error general de enlace."); setLoading(false); });
      }, []);

      useEffect(() => { cargarData(); }, []);

      const menuTabs = [['NPS', 'fa-solid fa-chart-line'], ['CSAT', 'fa-solid fa-star'], ['Inactivos', 'fa-solid fa-user-clock'], ['Salidas / Off', 'fa-solid fa-arrow-right-from-bracket']];

      return e('div', { className: 'min-h-screen flex flex-col justify-between' },
        e('div', {},
          e('header', { className: 'bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm px-6 py-4' },
            e('div', { className: 'max-w-7xl mx-auto flex items-center justify-between' },
              e('div', { className: 'flex items-center gap-3' },
                e('div', { className: 'w-10 h-10 rounded-xl bg-brand flex items-center justify-center text-white text-base shadow-md' }, e('i', { className: 'fa-solid fa-heart-pulse' })),
                e('div', {}, e('h1', { className: 'text-base font-extrabold text-gray-900 leading-none tracking-tight' }, 'Experiencia del cliente'), e('p', { className: 'text-[11px] text-gray-400 mt-1 font-medium' }, 'Métricas sincronizadas en vivo corporativo'))
              ),
              e('button', { onClick: cargarData, disabled: loading, className: 'p-2.5 bg-gray-50 hover:bg-gray-100 rounded-xl text-gray-400 border border-gray-200' }, e('i', { className: `fa-solid fa-arrow-rotate-right ${loading ? 'animate-spin' : ''}` }))
            ),
            e('div', { className: 'max-w-7xl mx-auto flex gap-6 -mb-4 mt-4 overflow-x-auto' }, menuTabs.map(([lbl, icon], id) => e('button', { key: id, onClick: () => setTab(id), className: `tab-btn pb-3 text-xs font-bold tracking-wider uppercase whitespace-nowrap flex items-center gap-2 ${tab === id ? 'active text-brand' : 'text-gray-400 hover:text-gray-600'}` }, e('i', { className: icon }), lbl)))
          ),
          e('main', { className: 'max-w-7xl mx-auto px-6 mt-6' },
            loading && e('div', { className: 'space-y-5' }, e('div', { className: 'skeleton h-20' }), e('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' }, e('div', { className: 'skeleton h-[300px]' }), e('div', { className: 'skeleton h-[300px]' })), e('div', { className: 'skeleton h-48 w-full' })),
            !loading && error && e('div', { className: 'card p-8 text-center max-w-md mx-auto mt-10 space-y-3 bg-white' }, e('i', { className: 'fa-solid fa-triangle-exclamation text-red-500 text-3xl' }), e('p', { className: 'font-bold text-gray-800' }, 'Error de conexión'), e('button', { onClick: cargarData, className: 'px-4 py-2 bg-brand text-white text-xs font-bold rounded-xl' }, 'Reintentar')),
            !loading && !error && data && e('div', {},
              tab === 0 && e(ModuleNPS, { rawNps: Array.isArray(data.nps) ? data.nps : [], metaHeaders: metaHeaders }),
              tab === 1 && e(ModuleCSAT, { abonoRaw: Array.isArray(data.csat_abono) ? data.csat_abono : [], reunionRaw: Array.isArray(data.csat_reunion) ? data.csat_reunion : [] }),
              tab === 2 && e(PlaceholderTab, { title: 'Análisis de Clientes Inactivos', icon: 'fa-user-clock', dataRaw: { inactivos: data.inactivos } }),
              tab === 3 && e(PlaceholderTab, { title: 'Registro de Procesos de Offboarding', icon: 'fa-arrow-right-from-bracket', dataRaw: { salidas: data.salidas } })
            )
          )
        ),
        e('footer', { className: 'text-center py-6 text-[11px] text-gray-400 mt-10 border-t border-gray-200 bg-white w-full' }, 'Apprecio · Dashboard Experiencia del cliente · 2026')
      );
    }

    ReactDOM.render(e(App), document.getElementById('root'));

    // ── FUNCIONES COMPLEMENTARIAS DEL MODAL (AGREGADAS) ──
    function openModal() {
      document.getElementById('report-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('report-modal').classList.remove('open');
    }

    document.getElementById('report-modal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>
</body>
